name: Release GitPaste

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set package version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run Web integration tests
        run: npm run test:web

      - name: Build VSIX
        run: npm run build

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          awk -v version="$version" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/N;/^\n[[:space:]]*$/D' > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for ${TAG_NAME}" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" gitpaste.vsix \
              --repo "$REPOSITORY" \
              --clobber
            gh release edit "$TAG_NAME" \
              --repo "$REPOSITORY" \
              --title "GitPaste $TAG_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" gitpaste.vsix \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "GitPaste $TAG_NAME" \
              --notes-file release-notes.md
          fi
