name: GitPaste CI

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    name: Lint, type-check and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

  release:
    name: Build and publish VSIX
    needs: check
    # Only release from a version tag; pull requests never publish.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set package version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX
        run: npm run build

      - name: Extract release notes from CHANGELOG
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const version = process.env.TAG_NAME.replace(/^v/, '');
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n');
          let start = -1;
          for (let i = 0; i < changelog.length; i++) {
            const m = changelog[i].match(/^##\s+(\S+)/);
            if (m && m[1] === version) { start = i; break; }
          }
          if (start === -1) {
            console.error('No CHANGELOG entry found for version ' + version);
            process.exit(1);
          }
          let end = changelog.length;
          for (let i = start + 1; i < changelog.length; i++) {
            if (/^##\s+/.test(changelog[i])) { end = i; break; }
          }
          const section = changelog.slice(start + 1, end).join('\n').trim();
          fs.writeFileSync('release-notes.md', section);
          console.log('Wrote release notes for ' + version + ' (' + section.length + ' chars)');
          NODE

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VSIX="gitpaste-v${VERSION}.vsix"
          NOTES_OPTS=""
          if [ -s release-notes.md ]; then
            NOTES_OPTS="--notes-file release-notes.md"
          fi
          if gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$VSIX" \
              --repo "$REPOSITORY" \
              --clobber
            gh release edit "$TAG_NAME" \
              --repo "$REPOSITORY" \
              --title "GitPaste $TAG_NAME" \
              $NOTES_OPTS
          else
            if [ -n "$NOTES_OPTS" ]; then
              gh release create "$TAG_NAME" "$VSIX" \
                --repo "$REPOSITORY" \
                --verify-tag \
                --title "GitPaste $TAG_NAME" \
                $NOTES_OPTS
            else
              gh release create "$TAG_NAME" "$VSIX" \
                --repo "$REPOSITORY" \
                --verify-tag \
                --title "GitPaste $TAG_NAME" \
                --generate-notes
            fi
          fi

  # Web integration tests run against a pinned VS Code build and depend on a
  # live browser download plus external services. A flaky or environment-driven
  # failure here must never block a release, so this job is non-blocking.
  web-tests:
    name: Web integration tests (non-blocking)
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Web integration tests
        # The --commit value pins the VS Code build under test. Update it when
        # bumping the @vscode/test-web baseline.
        run: npm run test:web
