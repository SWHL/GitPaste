name: Release GitPaste

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build VSIX
        run: npm run build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" gitpaste.vsix \
              --repo "$REPOSITORY" \
              --clobber
          else
            gh release create "$TAG_NAME" gitpaste.vsix \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "GitPaste $TAG_NAME" \
              --generate-notes
          fi
