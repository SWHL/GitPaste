name: GitPaste CI

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    name: Lint, type-check and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

  release:
    name: Build and publish VSIX
    needs: check
    # Only release from a version tag; pull requests never publish.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set package version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX
        run: npm run build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" gitpaste.vsix \
              --repo "$REPOSITORY" \
              --clobber
            gh release edit "$TAG_NAME" \
              --repo "$REPOSITORY" \
              --title "GitPaste $TAG_NAME"
          else
            gh release create "$TAG_NAME" gitpaste.vsix \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "GitPaste $TAG_NAME" \
              --generate-notes
          fi

  # Web integration tests run against a pinned VS Code build and depend on a
  # live browser download plus external services. A flaky or environment-driven
  # failure here must never block a release, so this job is non-blocking.
  web-tests:
    name: Web integration tests (non-blocking)
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Web integration tests
        # The --commit value pins the VS Code build under test. Update it when
        # bumping the @vscode/test-web baseline.
        run: npm run test:web
